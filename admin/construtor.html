<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Construtor de dashboard | CM Soluções Financeiras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="relatorio.css">
<link rel="stylesheet" href="widgets.css">
<link rel="stylesheet" href="construtor.css">
</head>
<body class="admin-body">

<!-- LOGIN -->
<div class="admin-login" id="loginScreen">
  <div class="admin-login-box">
    <img src="../assets/img/logo-cm.png" alt="CM Soluções Financeiras" class="admin-logo">
    <h1>Painel Administrativo</h1>
    <p class="admin-sub">Área restrita — acesso só para a equipe CM.</p>

    <form id="loginForm">
      <label for="userInput">Usuário</label>
      <input type="text" id="userInput" autocomplete="username" required>
      <label for="passInput">Senha</label>
      <input type="password" id="passInput" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block" id="btnEntrar">Entrar</button>
      <p class="admin-feedback" id="loginFeedback" role="status"></p>
    </form>
  </div>
</div>

<!-- ERRO INICIAL (cliente/relatório não encontrado, acesso negado, etc.) -->
<div class="cw-erro-inicial" id="erroInicial" hidden></div>

<!-- CONSTRUTOR -->
<div class="cw-app" id="construtorApp" hidden>
  <header class="admin-header">
    <div class="admin-header-inner cw-header-inner">
      <img src="../assets/img/logo-cm.png" alt="CM" class="admin-logo-sm">
      <div class="cw-header-titulos">
        <h1 id="nomeCliente">Cliente</h1>
        <input type="text" id="periodoInput" class="cw-periodo-input" placeholder="Período (ex: Outubro/2026)">
      </div>
      <span class="admin-dirty" id="dirtyBadge" hidden>Alterações não salvas</span>
      <p class="admin-feedback" id="salvarFeedback" role="status"></p>
      <button type="button" class="btn btn-primary btn-sm" id="btnSalvar">Salvar</button>
      <a href="#" class="btn btn-ghost btn-sm" id="linkVoltar">← Voltar</a>
      <button type="button" class="btn btn-outline btn-sm" id="btnSair">Sair</button>
    </div>
  </header>

  <nav class="cw-abas-nav" id="abasNav"></nav>

  <div class="cw-toolbar" id="toolbar">
    <span class="cw-toolbar-label">Adicionar bloco:</span>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="barras">+ Barras</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="linha">+ Linha</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="pizza">+ Pizza</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="tabela">+ Tabela</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="kpi">+ Indicador</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="texto">+ Texto</button>
    <button type="button" class="btn btn-outline btn-sm" data-add-tipo="segmentacao">+ Segmentação por período</button>
  </div>

  <main class="cw-canvas-wrap">
    <div class="cw-canvas" id="canvas"></div>
  </main>
</div>

<!-- MODAL: EDITAR DADOS DO BLOCO -->
<div class="admin-modal" id="modalWidget" hidden>
  <div class="admin-modal-box admin-modal-box-wide">
    <h2 id="modalWidgetTitulo">Editar bloco</h2>
    <label for="widgetTituloInput">Título do bloco</label>
    <input type="text" id="widgetTituloInput" placeholder="Ex: Receita por serviço">
    <div id="widgetSeletorPeriodoWrap" hidden></div>
    <div id="widgetCorpoEditor" class="cw-corpo-editor"></div>
    <div class="admin-modal-actions">
      <button type="button" class="btn btn-outline" id="btnCancelarWidget">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btnSalvarWidget">Aplicar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="widgets.js"></script>
<script src="construtor.js"></script>
</body>
</html>
